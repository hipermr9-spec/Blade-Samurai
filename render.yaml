services:
  - type: web
    name: blade-samurai-chat
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://blade-samurai.vercel.app
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: blade-samurai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
